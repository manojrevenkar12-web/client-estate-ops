name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP core (PHPUnit, PSR-12, PHPStan)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: estate } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none, tools: composer:v2 }
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --no-progress

  php-databases:
    name: Store on MySQL and PostgreSQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: estate }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: estate, POSTGRES_USER: estate, POSTGRES_DB: estate }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U estate" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none, tools: composer:v2, extensions: pdo_mysql, pdo_pgsql }
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: estate
      - name: Import the sandbox into both databases and read it back through the API
        run: |
          for dsn in "mysql:host=127.0.0.1;dbname=estate" "pgsql:host=127.0.0.1;dbname=estate"; do
            if [[ $dsn == mysql* ]]; then u=root; p=root; else u=estate; p=estate; fi
            ESTATE_DB_USER=$u ESTATE_DB_PASSWORD=$p php estate/tests/db_smoke.php "$dsn" var/sandbox.json
          done

  lab:
    name: Lab and estimator (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none, tools: composer:v2 }
      - run: composer dump-autoload
        working-directory: estate
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pyyaml fastapi pydantic httpx
      - run: python -m pytest -q
        working-directory: lab
      - run: python -m pytest -q
        working-directory: estimator
      - run: python ci-templates/lint.py ci-templates/gitlab/*.yml

  study:
    name: The dev study reproduces the committed report and README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none, tools: composer:v2 }
      - run: composer dump-autoload
        working-directory: estate
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install fastapi pydantic
      - name: Re-run the study
        working-directory: lab
        run: python -m estate_lab.study --world dev
      - name: Same numbers (timing aside)
        run: |
          python - <<'PY'
          import json, subprocess
          new = json.load(open("reports/dev.json"))
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:reports/dev.json"]))
          for r in (new, old):
              r.pop("took_seconds")
              for d in r["designs"]:
                  d.pop("product_calls", None)
          assert new == old, "reports/dev.json does not reproduce"
          PY
      - name: README dashboard matches
        run: |
          git checkout reports/dev.json
          cd lab && python -m estate_lab.readme && cd ..
          git diff --exit-code README.md docs/dashboard.svg

  terraform:
    name: Terraform modules (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate every example
        run: |
          for d in infra/terraform/examples/*/; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f estate/Dockerfile -t estate-api .
      - run: docker build -f estimator/Dockerfile -t estate-estimator .
      - name: The API image serves
        run: |
          docker run -d -p 8080:80 --name api estate-api
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          docker logs api; exit 1

  console:
    name: Console (vitest, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
