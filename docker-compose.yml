# The estate platform on one machine: the PHP API on PostgreSQL, the estimator, and the console.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: estate
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: estate
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "estate"]
      interval: 5s
  api:
    build: { context: ., dockerfile: estate/Dockerfile }
    environment:
      ESTATE_DSN: pgsql:host=db;dbname=estate
      ESTATE_DB_USER: estate
      ESTATE_DB_PASSWORD: estate
      ESTATE_TOKEN: change-me
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:80"]
  estimator:
    build: { context: ., dockerfile: estimator/Dockerfile }
    environment:
      ESTIMATOR_HISTORY: /srv/var/past_projects.json
    volumes: ["./var:/srv/var:ro"]
    ports: ["8090:8090"]
